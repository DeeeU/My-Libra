# iOS App CI/CD Pipeline
# Xcode プロジェクトのビルドとテスト

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available runtimes
      run: |
        echo "📋 Available runtimes:"
        xcrun simctl list runtimes

    - name: Cache iOS runtime
      id: cache-ios-runtime
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/CoreSimulator/Profiles/Runtimes
        key: ios-runtime-${{ runner.os }}-xcode-16.1
        restore-keys: |
          ios-runtime-${{ runner.os }}-

    - name: Install iOS runtime
      run: |
        echo "📦 Installing iOS runtime..."
        sudo xcodebuild -runFirstLaunch

        # Check if iOS simulators are available
        if xcrun simctl list devices | grep -q "iPhone"; then
          echo "✅ iOS simulators already available"
        else
          echo "⬇️ Downloading iOS platform..."
          sudo xcodebuild -downloadPlatform iOS
          echo "✅ iOS runtime installation complete"
        fi

    - name: Show available simulators
      run: |
        echo "📱 Available simulators:"
        xcrun simctl list devices available

    - name: Create simulator if needed
      run: |
        # Check if any iPhone simulator exists
        if ! xcrun simctl list devices | grep -q "iPhone.*Booted\|iPhone.*Shutdown"; then
          echo "📱 Creating iPhone 15 simulator..."
          RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | awk '{print $NF}')
          echo "Using runtime: $RUNTIME"
          xcrun simctl create "iPhone 15" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME" || true
        fi
        echo "✅ Simulator ready"

    - name: Build
      run: |
        cd My-Libra
        xcodebuild clean build \
          -project My-Libra.xcodeproj \
          -scheme My-Libra \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: |
        cd My-Libra
        xcodebuild test \
          -project My-Libra.xcodeproj \
          -scheme My-Libra \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -derivedDataPath DerivedData \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: My-Libra/DerivedData/Logs/Test/*.xcresult

    - name: Generate code coverage report
      if: success()
      run: |
        cd My-Libra
        xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json
        echo "📊 Code Coverage Report"
        xcrun xccov view --report DerivedData/Logs/Test/*.xcresult

    - name: Upload coverage report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: My-Libra/coverage.json
