# iOS App CI/CD Pipeline
# Xcode プロジェクトのビルドとテスト

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Check and cache iOS runtime
      id: ios-runtime-check
      run: |
        echo "🔍 Checking for iOS runtime..."
        if xcrun simctl list runtimes | grep -q "iOS"; then
          echo "✅ iOS runtime already available"
          echo "cache_hit=true" >> $GITHUB_OUTPUT
        else
          echo "📦 iOS runtime not found, will install"
          echo "cache_hit=false" >> $GITHUB_OUTPUT
        fi

    - name: Cache iOS runtime
      if: steps.ios-runtime-check.outputs.cache_hit != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/CoreSimulator/Caches
          ~/Library/Caches/com.apple.dt.Xcode
        key: ${{ runner.os }}-ios-runtime-${{ hashFiles('**/Xcode_16.1.app') }}
        restore-keys: |
          ${{ runner.os }}-ios-runtime-

    - name: Install iOS runtime
      if: steps.ios-runtime-check.outputs.cache_hit != 'true'
      run: |
        echo "📦 Installing iOS runtime..."
        sudo xcodebuild -runFirstLaunch
        sudo xcodebuild -downloadPlatform iOS
        echo "✅ iOS runtime installation complete"

    - name: Show available simulators
      run: xcrun simctl list devices available

    - name: Build
      run: |
        cd My-Libra
        xcodebuild clean build \
          -scheme My-Libra \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: |
        cd My-Libra
        xcodebuild test \
          -scheme My-Libra \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -derivedDataPath DerivedData \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: My-Libra/DerivedData/Logs/Test/*.xcresult

    - name: Generate code coverage report
      if: success()
      run: |
        cd My-Libra
        xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json
        echo "📊 Code Coverage Report"
        xcrun xccov view --report DerivedData/Logs/Test/*.xcresult

    - name: Upload coverage report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: My-Libra/coverage.json
