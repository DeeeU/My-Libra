# iOS App CI/CD Pipeline
# Xcode プロジェクトのビルドとテスト

name: iOS CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show environment
      run: |
        xcodebuild -version
        echo ""
        echo "📱 Available iPhone Simulators:"
        xcrun simctl list devices available | grep -E "iPhone" | head -10

    - name: Restore DerivedData cache
      uses: actions/cache@v4
      with:
        path: My-Libra/DerivedData
        key: deriveddata-${{ runner.os }}-${{ hashFiles('My-Libra/**/*.swift', 'My-Libra/**/*.pbxproj') }}
        restore-keys: |
          deriveddata-${{ runner.os }}-

    - name: Build and Test
      working-directory: My-Libra
      run: |
        xcodebuild test \
          -project My-Libra.xcodeproj \
          -scheme My-Libra \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
          -derivedDataPath DerivedData \
          -configuration Debug \
          -enableCodeCoverage YES \
          -parallel-testing-enabled YES \
          -maximum-concurrent-test-simulator-destinations 2 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: My-Libra/DerivedData/Logs/Test/*.xcresult

    - name: Generate Coverage Report
      if: success()
      working-directory: My-Libra
      run: |
        xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json
        echo "📊 Code Coverage Report:"
        xcrun xccov view --report DerivedData/Logs/Test/*.xcresult || true

    - name: Upload Coverage Report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: My-Libra/coverage.json
