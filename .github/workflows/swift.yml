# iOS App CI/CD Pipeline
# Xcode プロジェクトのビルドとテスト

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available destinations
      run: |
        cd My-Libra
        echo "📋 Available build destinations:"
        xcodebuild -project My-Libra.xcodeproj \
          -scheme My-Libra \
          -showdestinations

    - name: Build for iOS Simulator
      run: |
        cd My-Libra

        # シンプルで確実な方法：最初に見つかったシミュレーターを使用
        xcodebuild clean build \
          -project My-Libra.xcodeproj \
          -scheme My-Libra \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | tee build.log \
          | xcpretty || cat build.log

    - name: Run tests
      continue-on-error: true
      run: |
        cd My-Libra
        xcodebuild test \
          -project My-Libra.xcodeproj \
          -scheme My-Libra \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath DerivedData \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | tee test.log \
          | xcpretty || cat test.log

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: My-Libra/build.log
        if-no-files-found: ignore

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: My-Libra/DerivedData/Logs/Test/*.xcresult
        if-no-files-found: ignore

    - name: Generate code coverage report
      if: success()
      run: |
        cd My-Libra
        if ls DerivedData/Logs/Test/*.xcresult 1> /dev/null 2>&1; then
          xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json || true
          echo "📊 Code Coverage Report"
          xcrun xccov view --report DerivedData/Logs/Test/*.xcresult || true
        fi

    - name: Upload coverage report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: My-Libra/coverage.json
        if-no-files-found: ignore

